# El Paso / Ciudad Juarez US-Mexico Border Map
# Demonstrates cross-border data integration: Texas (US) and Chihuahua (Mexico)
# Using Census TIGER for US data and Mexico HDX/INEGI for Mexican data
# Plus Natural Earth for international boundary
#
# Optimized for pen plotter output on 12x18 inch paper

name: el_paso_border_12x18
description: El Paso TX and Ciudad Juarez MX border region - US/Mexico international boundary
version: 1

sources:
  # Texas county subdivisions (El Paso area)
  tx_towns:
    uri: census:tiger/2023/tx/cousub
    description: Texas county subdivisions (El Paso County)

  # Texas water bodies
  tx_water:
    uri: census:tiger/2023/tx/areawater
    description: Texas water bodies (Rio Grande area)

  # Texas roads
  tx_roads:
    uri: census:tiger/2023/tx/prisecroads
    description: Texas primary and secondary roads

  # Mexico states (Chihuahua)
  mexico_states:
    uri: mexico:mgn/state
    description: Mexico state boundaries

  # Mexico municipalities (more detail)
  mexico_municipalities:
    uri: mexico:hdx/admin2
    description: Mexico municipalities (Ciudad Juarez area)

  # International boundary
  intl_boundary:
    uri: naturalearth:10m/cultural/admin_0_boundary_lines_land
    description: International boundary lines

  # Countries for context
  countries:
    uri: naturalearth:10m/cultural/admin_0_countries
    description: Country polygons for fill

  # Rivers (Rio Grande)
  rivers:
    uri: naturalearth:10m/physical/rivers_lake_centerlines
    description: Major rivers including Rio Grande

layers:
  # Layer 1: Country backgrounds
  - name: countries
    source: countries
    operations:
      - type: simplify
        tolerance: 0.0005
    style:
      stroke: "#9e9e9e"
      stroke_width: 0.2
      fill: "#fafafa"
      vary_fill: false
    order: 1

  # Layer 2: Mexico states (Chihuahua background)
  - name: mexico_states
    source: mexico_states
    operations:
      - type: simplify
        tolerance: 0.0005
    style:
      stroke: "#81c784"
      stroke_width: 0.4
      fill: "#e8f5e9"
      vary_fill: true
    order: 2

  # Layer 3: Mexico municipalities (Ciudad Juarez detail)
  - name: mexico_muni
    source: mexico_municipalities
    operations:
      - type: simplify
        tolerance: 0.0003
    style:
      stroke: "#66bb6a"
      stroke_width: 0.3
      fill: "#c8e6c9"
      vary_fill: true
    order: 3

  # Layer 4: Texas towns
  - name: tx_towns
    source: tx_towns
    operations:
      - type: subtract
        target: tx_water
      - type: simplify
        tolerance: 0.0003
    style:
      stroke: "#5c6bc0"
      stroke_width: 0.4
      fill: "#e8eaf6"
      vary_fill: true
    order: 4

  # Layer 5: Rio Grande and other rivers
  - name: rivers
    source: rivers
    operations:
      - type: simplify
        tolerance: 0.0002
    style:
      stroke: "#1565c0"
      stroke_width: 0.8
      fill: none
    order: 5

  # Layer 6: Texas roads
  - name: tx_roads
    source: tx_roads
    filter:
      RTTYP: ["I", "U"]  # Interstates and US routes only
    operations:
      - type: simplify
        tolerance: 0.0002
    style:
      stroke: "#ef5350"
      stroke_width: 0.5
      fill: none
    order: 6

  # Layer 7: International boundary (top layer, prominent)
  - name: intl_boundary
    source: intl_boundary
    operations:
      - type: simplify
        tolerance: 0.0001
    style:
      stroke: "#d32f2f"
      stroke_width: 1.2
      fill: none
    order: 7

output:
  # Bounds centered on El Paso / Ciudad Juarez
  # El Paso is approximately: -106.5, 31.75
  # Extends to show both cities and surrounding region
  bounds: [-107.2, 31.2, -105.8, 32.3]
  projection: epsg:4326

  formats:
    - type: svg
      quality:
        - name: fine
          simplify: 0.0002
        - name: medium
          simplify: 0.0005
      options:
        per_layer: true
        combined: true
        page_size: [12, 18]
        margin: 0.5

    - type: geojson
      options:
        per_layer: true
        precision: 6
