# Oroville WA / Osoyoos BC US-Canada Border Map
# Demonstrates cross-border data integration: Washington (US) and British Columbia (Canada)
# Using Census TIGER for US data and Canada NRN/CanVec for Canadian data
# Plus Natural Earth for international boundary
#
# This region features Osoyoos Lake which crosses the border
#
# Optimized for pen plotter output on 12x18 inch paper

name: oroville_osoyoos_border_12x18
description: Oroville WA and Osoyoos BC border region - US/Canada boundary at Osoyoos Lake
version: 1

sources:
  # Washington places (cities, towns, CDPs)
  # Note: Using 'place' instead of 'cousub' due to Census.gov access issues with WA cousub
  wa_towns:
    uri: census:tiger/2023/wa/place
    description: Washington places (cities, towns, CDPs in Okanogan County area)

  # Washington water bodies
  wa_water:
    uri: census:tiger/2023/wa/areawater
    description: Washington water bodies (Osoyoos Lake area)

  # Washington roads
  wa_roads:
    uri: census:tiger/2023/wa/prisecroads
    description: Washington primary and secondary roads

  # British Columbia roads from NRN
  bc_roads:
    uri: canada:nrn/bc
    description: British Columbia road network

  # Canadian hydro (CanVec for Osoyoos Lake north portion)
  canada_hydro:
    uri: canada:canvec/hydro
    description: Canadian water bodies including Osoyoos Lake

  # International boundary
  intl_boundary:
    uri: naturalearth:10m/cultural/admin_0_boundary_lines_land
    description: International boundary lines

  # Countries for context
  countries:
    uri: naturalearth:10m/cultural/admin_0_countries
    description: Country polygons for fill

  # States/Provinces for regional context
  admin1:
    uri: naturalearth:10m/cultural/admin_1_states_provinces
    description: State and province boundaries

  # Lakes
  lakes:
    uri: naturalearth:10m/physical/lakes
    description: Major lakes

layers:
  # Layer 1: Country backgrounds
  - name: countries
    source: countries
    operations:
      - type: simplify
        tolerance: 0.001
    style:
      stroke: "#bdbdbd"
      stroke_width: 0.2
      fill: "#fafafa"
      vary_fill: false
    order: 1

  # Layer 2: State/Province boundaries
  - name: admin1
    source: admin1
    operations:
      - type: simplify
        tolerance: 0.0005
    style:
      stroke: "#9e9e9e"
      stroke_width: 0.3
      fill: "#f5f5f5"
      vary_fill: true
    order: 2

  # Layer 3: Washington towns
  - name: wa_towns
    source: wa_towns
    operations:
      - type: subtract
        target: wa_water
      - type: simplify
        tolerance: 0.0003
    style:
      stroke: "#5c6bc0"
      stroke_width: 0.4
      fill: "#e8eaf6"
      vary_fill: true
    order: 3

  # Layer 4: Osoyoos Lake and water (combined US + Canada)
  - name: osoyoos_lake
    source: [wa_water, canada_hydro]
    filter:
      min_area_km2: 1  # Filter to significant water bodies
    operations:
      - type: merge_touching  # Merge cross-border lake portions
        buffer_distance: 0.001
      - type: clean
      - type: simplify
        tolerance: 0.0002
    style:
      stroke: "#0d47a1"
      stroke_width: 0.6
      fill: "#bbdefb"
    order: 4

  # Layer 5: Natural Earth lakes (for other lakes in region)
  - name: lakes
    source: lakes
    operations:
      - type: simplify
        tolerance: 0.0003
    style:
      stroke: "#1976d2"
      stroke_width: 0.4
      fill: "#e3f2fd"
    order: 5

  # Layer 6: Washington roads
  - name: wa_roads
    source: wa_roads
    filter:
      RTTYP: ["I", "U", "S"]  # Interstates, US routes, State routes
    operations:
      - type: simplify
        tolerance: 0.0002
    style:
      stroke: "#ef5350"
      stroke_width: 0.4
      fill: none
    order: 6

  # Layer 7: BC roads (will be large, filter to main roads)
  - name: bc_roads
    source: bc_roads
    filter:
      # NRN has different attribute names - this may need adjustment
      ROADCLASS: ["1", "2", "3"]  # Main road classes
    operations:
      - type: simplify
        tolerance: 0.0003
    style:
      stroke: "#ff7043"
      stroke_width: 0.35
      fill: none
    order: 7

  # Layer 8: International boundary (top layer, prominent)
  - name: intl_boundary
    source: intl_boundary
    operations:
      - type: simplify
        tolerance: 0.0001
    style:
      stroke: "#d32f2f"
      stroke_width: 1.2
      fill: none
    order: 8

output:
  # Bounds centered on Oroville WA / Osoyoos BC border crossing
  # Oroville WA is approximately: -119.44, 48.94
  # Osoyoos BC is approximately: -119.47, 49.03
  # Extends to show Osoyoos Lake and surrounding area
  bounds: [-120.2, 48.5, -118.8, 49.6]
  projection: epsg:4326

  formats:
    - type: svg
      quality:
        - name: fine
          simplify: 0.0002
        - name: medium
          simplify: 0.0005
      options:
        per_layer: true
        combined: true
        page_size: [12, 18]
        margin: 0.5

    - type: geojson
      options:
        per_layer: true
        precision: 6
